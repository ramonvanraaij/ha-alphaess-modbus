# Pause Force Import
  - id: "AlphaESS_Force_Import_Pause"
    alias: AlphaESS Force Import Pause
    triggers:
      - trigger: state
        entity_id:
          - sensor.alphaess_current_house_load
      - trigger: state
        entity_id:
          - sensor.alphaess_inverter_work_mode
    conditions:
      - condition: state
        entity_id: input_boolean.alphaess_helper_force_import
        state: "on"
      - condition: state
        entity_id: input_boolean.alphaess_helper_force_import_pause
        state: "off"
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity_id: sensor.alphaess_house_load_force_import_power
                    state:
                      - "True"
                    for:
                      hours: 0
                      minutes: 0
                      seconds: 5
                  - condition: template
                    value_template: >-
                      {{ states('sensor.alphaess_current_pv_production')|int > (states('input_select.alphaess_helper_inverter_ac_limit').replace(' kW','')|float * 1000)|int }}
              - condition: template
                value_template: >-
                  {{ now() > state_attr('automation.alphaess_force_import_resume','last_triggered') | default(as_datetime(0), true) + timedelta(seconds=15) }}
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.alphaess_inverter_work_mode
                state: "1"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.alphaess_helper_force_import_pause
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x0880 # Dispatch Starting Register
          slave: !secret alphaess_modbus_slaveId
          value:
            - 0   # Dispatch Start
            - 0   # Dispatch Active Power, 32000 Offset (2 bytes/registers)
            - 32000
            - 0   # Dispatch Reactive Power, 10000 Offset (2 bytes/registers)
            - 10000
            - 0   # Dispatch Mode (2 = State of Charge Control)
            - 0   # Dispatch SOC  (0.392%/bit)
            - 0   # Dispatch Time (2 bytes/registers)
            - 90
            - 255 # Flow Direction
            - 0   # PV Switch
    mode: single
    max_exceeded: silent

# Resume Force Import
  - id: "AlphaESS_Force_Import_Resume"
    alias: AlphaESS Force Import Resume
    triggers:
      - trigger: time_pattern
        seconds: /5
    conditions:
      - condition: state
        entity_id: input_boolean.alphaess_helper_force_import
        state: "on"
      - condition: state
        entity_id: input_boolean.alphaess_helper_force_import_pause
        state: "on"
      - condition: template
        value_template: >-
          {{ now() > state_attr('automation.alphaess_force_import_pause','last_triggered') | default(as_datetime(0), true) + timedelta(seconds=15) }}
      - condition: state
        entity_id: sensor.alphaess_inverter_work_mode
        state: "1"
        for:
          hours: 0
          minutes: 10
          seconds: 0
      - condition: template
        value_template: >-
          {{ states('sensor.alphaess_current_house_load')|int < (states('input_number.alphaess_helper_force_import_power')|float * 1000)|int}}
      - condition: template
        value_template: >-
          {{ states('sensor.alphaess_current_pv_production')|int < (states('input_select.alphaess_helper_inverter_ac_limit').replace(' kW','')|float * 1000)|int}}
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.alphaess_helper_force_import_pause
    mode: single

