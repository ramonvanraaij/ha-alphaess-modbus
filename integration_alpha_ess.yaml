  - number:
      - name: AlphaESS Template Force Charging Power
        unique_id: AlphaESS_Template_Force_Charging_Power
        unit_of_measurement: "kW"
        icon: mdi:flash
        state: "{{ states('input_number.alphaess_helper_force_charging_power') }}"
        set_value:
          - action: input_number.set_value
            data:
              value: "{{ value }}"
            target:
              entity_id: input_number.alphaess_helper_force_charging_power
        step: 0.1
        min: 0
        max: "{{ (states('input_select.alphaess_helper_inverter_ac_limit').replace(' kW','')|float ) }}"
