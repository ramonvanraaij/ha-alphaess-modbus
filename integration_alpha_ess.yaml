# --- Start Force Import automations
# Set Force Import
  - id: "AlphaESS_Force_Import"
    alias: AlphaESS Force Import
    triggers:
      - trigger: state
        entity_id:
          - sensor.alphaess_current_house_load
    conditions:
      - condition: state
        entity_id: input_boolean.alphaess_helper_force_import
        state: "on"
      - condition: state
        entity_id: input_boolean.alphaess_helper_force_import_pause
        state: "off"
      - condition: template
        value_template: >-
          {{ now() > state_attr('automation.alphaess_force_import','last_triggered') | default(as_datetime(0), true) + timedelta(seconds=5) }}
    actions:
      - if:
          - condition: or
            conditions:
