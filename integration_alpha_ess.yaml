    conditions:
      - condition: state
        entity_id: input_boolean.alphaess_helper_force_import
        state: "on"
    actions:
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x0887 # Dispatch Time
          slave: !secret alphaess_modbus_slaveId
          value:
            - 0
            - "{{ (states('input_number.alphaess_helper_force_import_duration')|int) * 60 }}"
      - action: timer.cancel
        target:
          entity_id: timer.alphaess_helper_force_import_timer
      - action: timer.start
        target:
          entity_id: timer.alphaess_helper_force_import_timer
        data:
          duration: "{{ (states('input_number.alphaess_helper_force_import_duration')|int) * 60 }}"
    mode: single

# Update Force Import Power
  - id: "AlphaESS_Update_Force_Import_Power"
    alias: AlphaESS Update Force Import Power
    triggers:
      - trigger: state
        entity_id:
          - input_number.alphaess_helper_force_import_power
    conditions:
      - condition: state
        entity_id: input_boolean.alphaess_helper_force_import
        state: "on"
    actions:
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x0881 # Dispatch Active Power, 32000 Offset
          slave: !secret alphaess_modbus_slaveId
          value:
            - 0
            - "{{ 32000 + ((states('input_number.alphaess_helper_force_import_power')|float * 1000)|int) }}"
    mode: single
# --- End Force Export automations

# --- Start Dispatch automations
# Set Dispatch
  - id: "AlphaESS_Dispatch"
    alias: AlphaESS Dispatch
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.alphaess_helper_dispatch
        to: "on"
    actions:
      - if:
          - condition: or
            conditions:
              - condition: state
                entity_id: input_boolean.alphaess_helper_force_charging
                state: "on"
              - condition: state
                entity_id: input_boolean.alphaess_helper_force_discharging
                state: "on"
              - condition: state
                entity_id: input_boolean.alphaess_helper_force_export
                state: "on"
              - condition: state
                entity_id: input_boolean.alphaess_helper_force_import
                state: "on"
              - condition: state
                entity_id: input_boolean.alphaess_helper_dispatch
                enabled: false
                state: "on"
              - condition: state
                entity_id: input_boolean.alphaess_helper_excess_export
                state: "on"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.alphaess_helper_force_charging
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.alphaess_helper_force_discharging
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.alphaess_helper_force_export
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.alphaess_helper_force_import
          - if:
              - condition: state
                entity_id: input_boolean.alphaess_helper_force_import
                state: "off"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.alphaess_helper_force_import_pause
                data: {}
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.alphaess_helper_dispatch
            enabled: false
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.alphaess_helper_excess_export
          - if:
              - condition: state
                entity_id: input_boolean.alphaess_helper_excess_export
                state: "off"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.alphaess_helper_excess_export_pause
                data: {}
          - action: timer.cancel
            target:
              entity_id: timer.alphaess_helper_force_charging_timer
          - action: timer.cancel
            target:
              entity_id: timer.alphaess_helper_force_discharging_timer
          - action: timer.cancel
            target:
              entity_id: timer.alphaess_helper_force_export_timer
          - action: timer.cancel
            target:
              entity_id: timer.alphaess_helper_force_import_timer
          - action: timer.cancel
            target:
              entity_id: timer.alphaess_helper_dispatch_timer
          - delay:
              seconds: 2
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x0880 # Dispatch Starting Register
          slave: !secret alphaess_modbus_slaveId
          value:
            - 1   # Dispatch Start
            - 0   # Dispatch Active Power, 32000 Offset (2 bytes/registers)
            - >
              {% set dispatch_mode = states('input_select.alphaess_helper_dispatch_mode').split('(')[1].split(')')[0] %}
              {% if dispatch_mode == "1" or dispatch_mode == "2" or dispatch_mode == "3" or dispatch_mode == "5" %}
                {{ 32000 + ((states('input_number.alphaess_helper_dispatch_power')|float * 1000)|int) }}
              {% else %}
                32000
              {% endif %}
            - 0   # Dispatch Reactive Power, 10000 Offset (2 bytes/registers)
            - 10000
            - "{{ states('input_select.alphaess_helper_dispatch_mode').split('(')[1].split(')')[0] }}"
            - >
              {% set dispatch_mode = states('input_select.alphaess_helper_dispatch_mode').split('(')[1].split(')')[0] %}
              {% if dispatch_mode == "2" %}
                {{ (states('input_number.alphaess_helper_dispatch_cutoff_soc')|int / 0.392) |int }}
              {% else %}
                0
              {% endif %}
            - 0   # Dispatch Time (2 bytes/registers)
            - "{{ (states('input_number.alphaess_helper_dispatch_duration')|int) * 60 }}"
            - 255 # Flow Direction
            - >
              {% if states('input_boolean.alphaess_helper_dispatch_pv_switch') == "on" %}
                1
              {% else %}
                2
              {% endif %}
      - action: timer.start
        target:
          entity_id: timer.alphaess_helper_dispatch_timer
        data:
          duration: "{{ (states('input_number.alphaess_helper_dispatch_duration')|int) * 60 }}"
    mode: single

# Update Dispatch Mode
  - id: "AlphaESS_Update_Dispatch_Mode"
    alias: AlphaESS Update Dispatch Mode
    triggers:
      - trigger: state
        entity_id:
          - input_select.alphaess_helper_dispatch_mode
    conditions:
      - condition: state
        entity_id: input_boolean.alphaess_helper_dispatch
        state: "on"
    actions:
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x0880 # Dispatch Starting Register
          slave: !secret alphaess_modbus_slaveId
          value:
            - 0   # Dispatch Start
            - 0   # Dispatch Active Power, 32000 Offset (2 bytes/registers)
            - 32000
            - 0   # Dispatch Reactive Power, 10000 Offset (2 bytes/registers)
            - 10000
            - 0   # Dispatch Mode (2 = State of Charge Control)
            - 0   # Dispatch SOC  (0.392%/bit)
            - 0   # Dispatch Time (2 bytes/registers)
            - 90
            - 255 # Flow Direction
            - 0   # PV Switch
      - action: timer.cancel
        target:
          entity_id: timer.alphaess_helper_dispatch_timer
      - delay:
          seconds: 2
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x0880 # Dispatch Starting Register
          slave: !secret alphaess_modbus_slaveId
          value:
            - 1   # Dispatch Start
            - 0   # Dispatch Active Power, 32000 Offset (2 bytes/registers)
            - >
              {% set dispatch_mode = states('input_select.alphaess_helper_dispatch_mode').split('(')[1].split(')')[0] %}
              {% if dispatch_mode == "1" or dispatch_mode == "2" or dispatch_mode == "3" or dispatch_mode == "5" %}
                {{ 32000 + ((states('input_number.alphaess_helper_dispatch_power')|float * 1000)|int) }}
              {% else %}
                32000
              {% endif %}
            - 0   # Dispatch Reactive Power, 10000 Offset (2 bytes/registers)
            - 10000
            - "{{ states('input_select.alphaess_helper_dispatch_mode').split('(')[1].split(')')[0] }}"
            - >
              {% set dispatch_mode = states('input_select.alphaess_helper_dispatch_mode').split('(')[1].split(')')[0] %}
              {% if dispatch_mode == "2" %}
                {{ (states('input_number.alphaess_helper_dispatch_cutoff_soc')|int / 0.392) |int }}
              {% else %}
                0
              {% endif %}
            - 0   # Dispatch Time (2 bytes/registers)
            - "{{ (states('input_number.alphaess_helper_dispatch_duration')|int) * 60 }}"
            - 255 # Flow Direction
            - >
              {% if states('input_boolean.alphaess_helper_dispatch_pv_switch') == "on" %}
                1
              {% else %}
                2
              {% endif %}
      - action: timer.start
        target:
          entity_id: timer.alphaess_helper_dispatch_timer
        data:
          duration: "{{ (states('input_number.alphaess_helper_dispatch_duration')|int) * 60 }}"
    mode: single

# Update Dispatch Cutoff SoC
  - id: "AlphaESS_Update_Dispatch_Cutoff_SoC"
    alias: AlphaESS Update Dispatch Cutoff SoC
    triggers:
      - trigger: state
        entity_id:
          - input_number.alphaess_helper_dispatch_cutoff_soc
    conditions:
      - condition: state
        entity_id: input_boolean.alphaess_helper_dispatch
        state: "on"
      - condition: state
        entity_id: input_select.alphaess_helper_dispatch_mode
        state: "State of Charge Control (2)"
    actions:
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x0886 # Dispatch SoC (0.392%/bit)
          slave: !secret alphaess_modbus_slaveId
          value:
            - "{{ (states('input_number.alphaess_helper_dispatch_cutoff_soc')|int / 0.392) |int }}"
    mode: single

# Update Dispatch Duration
  - id: "AlphaESS_Update_Dispatch_Duration"
    alias: AlphaESS Update Force Charging Duration
    triggers:
      - trigger: state
        entity_id:
          - input_number.alphaess_helper_dispatch_duration
    conditions:
      - condition: state
        entity_id: input_boolean.alphaess_helper_dispatch
        state: "on"
    actions:
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x0887 # Dispatch Time
          slave: !secret alphaess_modbus_slaveId
          value:
            - 0
            - "{{ (states('input_number.alphaess_helper_dispatch_duration')|int) * 60 }}"
      - action: timer.cancel
        target:
          entity_id: timer.alphaess_helper_dispatch_timer
      - action: timer.start
        target:
          entity_id: timer.alphaess_helper_dispatch_timer
        data:
          duration: "{{ (states('input_number.alphaess_helper_dispatch_duration')|int) * 60 }}"
    mode: single

# Update Dispatch Power
  - id: "AlphaESS_Update_Dispatch_Power"
    alias: AlphaESS Update Dispatch Power
    triggers:
      - trigger: state
        entity_id:
          - input_number.alphaess_helper_dispatch_power
    conditions:
      - condition: state
        entity_id: input_boolean.alphaess_helper_dispatch
        state: "on"
      - condition: or
        conditions:
          - condition: state
            entity_id: input_select.alphaess_helper_dispatch_mode
            state: "Battery only Charges from PV (1)"
          - condition: state
            entity_id: input_select.alphaess_helper_dispatch_mode
            state: "State of Charge Control (2)"
          - condition: state
            entity_id: input_select.alphaess_helper_dispatch_mode
            state: "Load Following (3)"
          - condition: state
            entity_id: input_select.alphaess_helper_dispatch_mode
            state: "Normal Mode (5)"
    actions:
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x0881 # Dispatch Active Power, 32000 Offset
          slave: !secret alphaess_modbus_slaveId
          value:
            - 0
            - "{{ 32000 + ((states('input_number.alphaess_helper_dispatch_power')|float * 1000)|int) }}"
    mode: single

# Update Dispatch PV Switch
  - id: "AlphaESS_Update_Dispatch_PV_Switch"
    alias: AlphaESS Update Dispatch PV Switch
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.alphaess_helper_dispatch_pv_switch
    conditions:
      - condition: state
        entity_id: input_boolean.alphaess_helper_dispatch
        state: "on"
    actions:
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x088A # PV Switch
          slave: !secret alphaess_modbus_slaveId
          value:
            - >
              {% if states('input_boolean.alphaess_helper_dispatch_pv_switch') == "on" %}
                1
              {% else %}
                2
              {% endif %}
    mode: single

# --- End Dispatch automations

#-------------------------------------------------------------------------------------------------------------------------------#
#-------------------------------------------------------------------------------------------------------------------------------#
#-------------------------------------------------------------------------------------------------------------------------------#

# Set Excess_Export, here:
#   - Power:
#       If PV Output > Inverter Limit + PV_AC:
#         Charge Battery with Excess - which directs the remainder to House Load and Feed-in
#       Else:
#         Charge Battery with Zero - which directs all PV Output to House Load and Feed-in
#   - Cutoff SoC = 100%
#   - Duration = 5min
  - id: "AlphaESS_Excess_Export"
    alias: AlphaESS Excess Export
    triggers:
      - trigger: state
        entity_id:
          - sensor.alphaess_current_pv_production
    conditions:
      - condition: state
        entity_id: input_boolean.alphaess_helper_excess_export
        state: "on"
      - condition: state
        entity_id: input_boolean.alphaess_helper_excess_export_pause
        state: "off"
    actions:
      - if:
          - condition: or
            conditions:
              - condition: state
                entity_id: input_boolean.alphaess_helper_force_charging
                state: "on"
              - condition: state
                entity_id: input_boolean.alphaess_helper_force_discharging
                state: "on"
              - condition: state
                entity_id: input_boolean.alphaess_helper_force_export
                state: "on"
              - condition: state
                entity_id: input_boolean.alphaess_helper_force_import
                state: "on"
              - condition: state
                entity_id: input_boolean.alphaess_helper_dispatch
                state: "on"
              - condition: state
                entity_id: input_boolean.alphaess_helper_excess_export
                state: "on"
                enabled: false
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.alphaess_helper_force_charging
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.alphaess_helper_force_discharging
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.alphaess_helper_force_export
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.alphaess_helper_force_import
          - if:
              - condition: state
                entity_id: input_boolean.alphaess_helper_force_import
                state: "off"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.alphaess_helper_force_import_pause
                data: {}
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.alphaess_helper_dispatch
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.alphaess_helper_excess_export
            enabled: false
          - if:
              - condition: state
                entity_id: input_boolean.alphaess_helper_excess_export
                state: "off"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.alphaess_helper_excess_export_pause
                data: {}
          - action: timer.cancel
            target:
              entity_id: timer.alphaess_helper_force_charging_timer
          - action: timer.cancel
            target:
              entity_id: timer.alphaess_helper_force_discharging_timer
          - action: timer.cancel
            target:
              entity_id: timer.alphaess_helper_force_export_timer
          - action: timer.cancel
            target:
              entity_id: timer.alphaess_helper_force_import_timer
          - action: timer.cancel
            target:
              entity_id: timer.alphaess_helper_dispatch_timer
          - delay:
              seconds: 2
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x0880 # Dispatch Starting Register
          slave: !secret alphaess_modbus_slaveId
          value:
            - 1   # Dispatch Start
            - 0   # Dispatch Active Power, 32000 Offset (2 bytes/registers)
            - >
              {% if states('sensor.alphaess_current_pv_production')|int > (states('input_select.alphaess_helper_inverter_ac_limit').replace(' kW','')|float * 1000)|int + states('sensor.alphaess_active_power_pv_meter')|int %}
                {{ 32000 - (states('sensor.alphaess_current_pv_production')|int - (states('input_select.alphaess_helper_inverter_ac_limit').replace(' kW','')|float * 1000)|int - states('sensor.alphaess_active_power_pv_meter')|int) }}
              {% else %}
                32000
              {% endif %}
            - 0   # Dispatch Reactive Power, 10000 Offset (2 bytes/registers)
            - 10000
            - 2   # Dispatch Mode (2 = State of Charge Control)
            - 255 # Dispatch SOC  (0.392%/bit)
            - 0   # Dispatch Time (2 bytes/registers)
            - 300 # 5 min
            - 255 # Flow Direction
            - 0   # PV Switch
    mode: single
    max_exceeded: silent

# Pause Excess_Export
  - id: "AlphaESS_Excess_Export_Pause"
    alias: AlphaESS Excess Export Pause
    triggers:
      - trigger: state
        entity_id:
          - sensor.alphaess_power_grid
      - trigger: state
        entity_id:
          - sensor.alphaess_inverter_work_mode
    conditions:
      - condition: state
        entity_id: input_boolean.alphaess_helper_excess_export
        state: "on"
      - condition: state
        entity_id: input_boolean.alphaess_helper_excess_export_pause
        state: "off"
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: numeric_state
                entity_id: sensor.alphaess_power_grid
                above: 50
              - condition: template
                value_template: >-
                  {{ now() > state_attr('automation.alphaess_excess_export_resume','last_triggered') | default(as_datetime(0), true) + timedelta(seconds=15) }}
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.alphaess_inverter_work_mode
                state: "1"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.alphaess_helper_excess_export_pause
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x0880 # Dispatch Starting Register
          slave: !secret alphaess_modbus_slaveId
          value:
            - 0   # Dispatch Start
            - 0   # Dispatch Active Power, 32000 Offset (2 bytes/registers)
            - 32000
            - 0   # Dispatch Reactive Power, 10000 Offset (2 bytes/registers)
            - 10000
            - 0   # Dispatch Mode (2 = State of Charge Control)
            - 0   # Dispatch SOC  (0.392%/bit)
            - 0   # Dispatch Time (2 bytes/registers)
            - 90
            - 255 # Flow Direction
            - 0   # PV Switch
    mode: single
    max_exceeded: silent

# Resume Excess_Export
  - id: "AlphaESS_Excess_Export_Resume"
    alias: AlphaESS Excess Export Resume
    triggers:
      - trigger: time_pattern
        seconds: /5
    conditions:
      - condition: state
        entity_id: input_boolean.alphaess_helper_excess_export
        state: "on"
      - condition: state
        entity_id: input_boolean.alphaess_helper_excess_export_pause
        state: "on"
      - condition: numeric_state
        entity_id: sensor.alphaess_current_pv_production
        above: 100
      - condition: template
        value_template: >-
          {{ now() > state_attr('automation.alphaess_excess_export_pause','last_triggered') | default(as_datetime(0), true) + timedelta(seconds=15) }}
      - condition: state
        entity_id: sensor.alphaess_inverter_work_mode
        state: "1"
        for:
          hours: 0
          minutes: 10
          seconds: 0
      - condition: or
        conditions:
          - condition: numeric_state
            entity_id: sensor.alphaess_excess_power
            above: 50
          - condition: numeric_state
            entity_id: sensor.alphaess_power_grid
            below: -500
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.alphaess_helper_excess_export_pause
    mode: single

#-------------------------------------------------------------------------------------------------------------------------------#
#-------------------------------------------------------------------------------------------------------------------------------#
#-------------------------------------------------------------------------------------------------------------------------------#

# Reset Dispatch Registers
  - id: "AlphaESS_Dispatch_Reset"
    alias: AlphaESS Dispatch Reset
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.alphaess_helper_force_charging
        to: "off"
      - trigger: state
        entity_id:
          - input_boolean.alphaess_helper_force_discharging
        to: "off"
      - trigger: state
        entity_id:
          - input_boolean.alphaess_helper_force_export
        to: "off"
      - trigger: state
        entity_id:
          - input_boolean.alphaess_helper_force_import
        to: "off"
      - trigger: state
        entity_id:
          - input_boolean.alphaess_helper_dispatch
        to: "off"
      - trigger: state
        entity_id:
          - input_boolean.alphaess_helper_excess_export
        to: "off"
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.alphaess_helper_force_charging_timer
        enabled: false
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.alphaess_helper_force_discharging_timer
        enabled: false
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.alphaess_helper_force_export_timer
        enabled: false
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.alphaess_helper_force_import_timer
        enabled: false
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.alphaess_helper_dispatch_timer
        enabled: false
    actions:
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x0880 # Dispatch Starting Register
          slave: !secret alphaess_modbus_slaveId
          value:
            - 0   # Dispatch Start
            - 0   # Dispatch Active Power, 32000 Offset (2 bytes/registers)
            - 32000
            - 0   # Dispatch Reactive Power, 10000 Offset (2 bytes/registers)
            - 10000
            - 0   # Dispatch Mode (2 = State of Charge Control)
            - 0   # Dispatch SOC  (0.392%/bit)
            - 0   # Dispatch Time (2 bytes/registers)
            - 90
            - 255 # Flow Direction
            - 0   # PV Switch
      - if:
          - condition: state
            entity_id: input_boolean.alphaess_helper_force_import
            state: "off"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.alphaess_helper_force_import_pause
      - if:
          - condition: state
            entity_id: input_boolean.alphaess_helper_excess_export
            state: "off"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.alphaess_helper_excess_export_pause
      - action: timer.cancel
        target:
          entity_id: timer.alphaess_helper_force_charging_timer
      - action: timer.cancel
        target:
          entity_id: timer.alphaess_helper_force_discharging_timer
      - action: timer.cancel
        target:
          entity_id: timer.alphaess_helper_force_export_timer
      - action: timer.cancel
        target:
          entity_id: timer.alphaess_helper_force_import_timer
      - action: timer.cancel
        target:
          entity_id: timer.alphaess_helper_dispatch_timer
    mode: single
    max_exceeded: silent

# Reset Dispatch Full
  - id: "AlphaESS_Dispatch_Reset_Full"
    alias: AlphaESS Dispatch Reset Full
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sensor.alphaess_power_grid
        to:
          - "unknown"
          - "unavailable"
      - trigger: state
        entity_id:
          - input_button.alphaess_helper_dispatch_reset_full
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.alphaess_helper_force_charging_timer
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.alphaess_helper_force_discharging_timer
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.alphaess_helper_force_import_timer
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.alphaess_helper_force_export_timer
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.alphaess_helper_dispatch_timer
    actions:
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x0880 # Dispatch Starting Register
          slave: !secret alphaess_modbus_slaveId
          value:
            - 0   # Dispatch Start
            - 0   # Dispatch Active Power, 32000 Offset (2 bytes/registers)
            - 32000
            - 0   # Dispatch Reactive Power, 10000 Offset (2 bytes/registers)
            - 10000
            - 0   # Dispatch Mode (2 = State of Charge Control)
            - 0   # Dispatch SOC  (0.392%/bit)
            - 0   # Dispatch Time (2 bytes/registers)
            - 90
            - 255 # Flow Direction
            - 0   # PV Switch
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.alphaess_helper_force_charging
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.alphaess_helper_force_discharging
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.alphaess_helper_force_export
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.alphaess_helper_force_import
      - if:
          - condition: state
            entity_id: input_boolean.alphaess_helper_force_import
            state: "off"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.alphaess_helper_force_import_pause
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.alphaess_helper_dispatch
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.alphaess_helper_excess_export
      - if:
          - condition: state
            entity_id: input_boolean.alphaess_helper_excess_export
            state: "off"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.alphaess_helper_excess_export_pause
      - action: timer.cancel
        target:
          entity_id: timer.alphaess_helper_force_charging_timer
      - action: timer.cancel
        target:
          entity_id: timer.alphaess_helper_force_discharging_timer
      - action: timer.cancel
        target:
          entity_id: timer.alphaess_helper_force_export_timer
      - action: timer.cancel
        target:
          entity_id: timer.alphaess_helper_dispatch_timer
    mode: single

#-------------------------------------------------------------------------------------------------------------------------------#

# Template sensors
template:
  - sensor:
# Total House Load
    - name: AlphaESS Total House Load
      unique_id: AlphaESS_Total_House_Load
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
      state: "{{ (states('sensor.alphaess_total_energy_from_pv')|float(0) + states('sensor.alphaess_total_energy_consumption_from_grid_meter')|float(0) - states('sensor.alphaess_total_energy_feed_to_grid_meter')|float(0))|round(2) }}"
      availability: "{{ not 'unavailable' in [ states('sensor.alphaess_total_energy_from_pv'), states('sensor.alphaess_total_energy_consumption_from_grid_meter'), states('sensor.alphaess_total_energy_feed_to_grid_meter') ] }}"
      # Alternative calculation:
      # state: "{{ (states('sensor.alphaess_total_energy_consumption_from_grid_meter')|float(0) - states('sensor.alphaess_total_energy_feed_to_grid_meter')|float(0) + states('sensor.alphaess_total_energy_charge_battery')|float(0) - states('sensor.alphaess_total_energy_discharge_battery')|float(0) + states('sensor.alphaess_total_energy_from_pv')|float(0))|round(2) }}"
      # availability: "{{ not 'unavailable' in [ states('sensor.alphaess_total_energy_consumption_from_grid_meter'), states('sensor.alphaess_total_energy_feed_to_grid_meter'), states('sensor.alphaess_total_energy_charge_battery'), states('sensor.alphaess_total_energy_discharge_battery'), states('sensor.alphaess_total_energy_from_pv') ] }}"
# Today's House Load
    - name: AlphaESS Today's House Load 
      unique_id: AlphaESS_Today_s_House_Load
      unit_of_measurement: kWh
      device_class: energy
      state_class: total
      icon: mdi:lightning-bolt
      state: "{{ (states('sensor.alphaess_today_s_energy_consumption_from_grid_meter')|float(0) - states('sensor.alphaess_today_s_energy_feed_to_grid_meter')|float(0)) - (states('sensor.alphaess_today_s_energy_charge_battery')|float(0) - states('sensor.alphaess_today_s_energy_discharge_battery')|float(0)) + states('sensor.alphaess_today_s_energy_from_pv')|float(0) + states('sensor.alphaess_today_s_energy_from_pv_meter')|float(0) }}"
# Self-Sufficiency Today
    - name: AlphaESS Self-Sufficiency Today
      unique_id: AlphaESS_Self_Sufficiency_Today
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:home-battery
      state: >
        {% set load = states('sensor.alphaess_today_s_house_load')|float(0) %}
        {% set imp = states('sensor.alphaess_today_s_energy_consumption_from_grid_meter')|float(0) %}
        {{ ([0, [((load - imp) / load * 100), 100]|min]|max|round(1)) if load > 0.01 else 0 }}
      availability: "{{ states('sensor.alphaess_today_s_house_load') not in ['unknown','unavailable'] and states('sensor.alphaess_today_s_energy_consumption_from_grid_meter') not in ['unknown','unavailable'] }}"
# Self-Consumption Today
    - name: AlphaESS Self-Consumption Today
      unique_id: AlphaESS_Self_Consumption_Today
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:solar-power-variant
      state: >
        {% set pv = states('sensor.alphaess_today_s_energy_from_pv')|float(0) + states('sensor.alphaess_today_s_energy_from_pv_meter')|float(0) %}
        {% set exp = states('sensor.alphaess_today_s_energy_feed_to_grid_meter')|float(0) %}
        {{ ([0, [((pv - exp) / pv * 100), 100]|min]|max|round(1)) if pv > 0.01 else 0 }}
      availability: "{{ states('sensor.alphaess_today_s_energy_from_pv') not in ['unknown','unavailable'] and states('sensor.alphaess_today_s_energy_from_pv_meter') not in ['unknown','unavailable'] and states('sensor.alphaess_today_s_energy_feed_to_grid_meter') not in ['unknown','unavailable'] }}"
# Current PV Production
    - name: AlphaESS Current PV Production
      unique_id: AlphaESS_Current_PV_Production
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: "{{ (states('sensor.alphaess_pv1_power')|int + states('sensor.alphaess_pv2_power')|int + states('sensor.alphaess_pv3_power')|int + states('sensor.alphaess_pv4_power')|int + states('sensor.alphaess_active_power_pv_meter')|int)|int }}"
      availability: "{{ not 'unavailable' in [ states('sensor.alphaess_pv1_power'), states('sensor.alphaess_pv2_power'), states('sensor.alphaess_pv3_power'), states('sensor.alphaess_pv4_power'), states('sensor.alphaess_active_power_pv_meter') ] }}"
# Current House Load
    - name: AlphaESS Current House Load
      unique_id: AlphaESS_Current_House_Load
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {% if states('sensor.alphaess_inverter_work_mode') | float == 2 %}
          {{ states('sensor.alphaess_power_grid')|float|round(0) }}
        {% else %}
          {{ (0,(states('sensor.alphaess_current_pv_production')|int(0) + states('sensor.alphaess_power_battery')|int(0) + states('sensor.alphaess_power_grid')|int(0))|int) | max }}
        {% endif %}
      availability: "{{ not 'unavailable' in [ states('sensor.alphaess_current_pv_production'), states('sensor.alphaess_power_battery'), states('sensor.alphaess_power_grid') ] }}"
      # Alternative calculation, excluding the inverter's power consumption:
      # state: "{{ (0,(states('sensor.alphaess_power_inverter')|float|round(0) + states('sensor.alphaess_power_grid')| float|round(0))) | max }}"
      # availability: "{{ not 'unavailable' in [ states('sensor.alphaess_power_inverter'), states('sensor.alphaess_power_grid') ] }}"
# Charging Period 1
    - name: AlphaESS Charging Period 1
      unique_id: AlphaESS_Charging_Period_1
      state: "{{ states('sensor.alphaess_charging_period_1_start_hour')|int }}:{{ '%02i'%states('sensor.alphaess_charging_period_1_start_minute')|int }} - {{ states('sensor.alphaess_charging_period_1_stop_hour')|int }}:{{ '%02i'%states('sensor.alphaess_charging_period_1_stop_minute')|int }}"
      availability: "{{ not 'unavailable' in [ states('sensor.alphaess_charging_period_1_start_hour'), states('sensor.alphaess_charging_period_1_start_minute'), states('sensor.alphaess_charging_period_1_stop_hour'), states('sensor.alphaess_charging_period_1_stop_minute') ] }}"
# Charging Period 2
    - name: AlphaESS Charging Period 2
      unique_id: AlphaESS_Charging_Period_2
      state: "{{ states('sensor.alphaess_charging_period_2_start_hour')|int }}:{{ '%02i'%states('sensor.alphaess_charging_period_2_start_minute')|int }} - {{ states('sensor.alphaess_charging_period_2_stop_hour')|int }}:{{ '%02i'%states('sensor.alphaess_charging_period_2_stop_minute')|int }}"
      availability: "{{ not 'unavailable' in [ states('sensor.alphaess_charging_period_2_start_hour'), states('sensor.alphaess_charging_period_2_start_minute'), states('sensor.alphaess_charging_period_2_stop_hour'), states('sensor.alphaess_charging_period_2_stop_minute') ] }}"
# Discharging Period 1
    - name: AlphaESS Discharging Period 1
      unique_id: AlphaESS_Discharging_Period_1
      state: "{{ states('sensor.alphaess_discharging_period_1_start_hour')|int }}:{{ '%02i'%states('sensor.alphaess_discharging_period_1_start_minute')|int }} - {{ states('sensor.alphaess_discharging_period_1_stop_hour')|int }}:{{ '%02i'%states('sensor.alphaess_discharging_period_1_stop_minute')|int }}"
      availability: "{{ not 'unavailable' in [ states('sensor.alphaess_discharging_period_1_start_hour'), states('sensor.alphaess_discharging_period_1_start_minute'), states('sensor.alphaess_discharging_period_1_stop_hour'), states('sensor.alphaess_discharging_period_1_stop_minute') ] }}"
# Discharging Period 2
    - name: AlphaESS Discharging Period 2
      unique_id: AlphaESS_Discharging_Period_2
      state: "{{ states('sensor.alphaess_discharging_period_2_start_hour')|int }}:{{ '%02i'%states('sensor.alphaess_discharging_period_2_start_minute')|int }} - {{ states('sensor.alphaess_discharging_period_2_stop_hour')|int }}:{{ '%02i'%states('sensor.alphaess_discharging_period_2_stop_minute')|int }}"
      availability: "{{ not 'unavailable' in [ states('sensor.alphaess_discharging_period_2_start_hour'), states('sensor.alphaess_discharging_period_2_start_minute'), states('sensor.alphaess_discharging_period_2_stop_hour'), states('sensor.alphaess_discharging_period_2_stop_minute') ] }}"
# Local IP Normalised
    - name: AlphaESS Local IP Normalised
      unique_id: AlphaESS_Local_IP_Normalised
      state: "{{ ('%0x' % states('sensor.alphaess_local_ip')|int)[:2]|int(base=16) }}.{{ ('%0x' % states('sensor.alphaess_local_ip')|int)[2:4]|int(base=16) }}.{{ ('%0x' % states('sensor.alphaess_local_ip')|int)[4:6]|int(base=16) }}.{{ ('%0x' % states('sensor.alphaess_local_ip')|int)[6:8]|int(base=16) }}"
      availability: "{{ states('sensor.alphaess_local_ip') }}"
# Subnet Mask Normalised
    - name: AlphaESS Subnet Mask Normalised
      unique_id: AlphaESS_Subnet_Mask_Normalised
      state: "{{ ('%0x' % states('sensor.alphaess_subnet_mask')|int)[:2]|int(base=16) }}.{{ ('%0x' % states('sensor.alphaess_subnet_mask')|int)[2:4]|int(base=16) }}.{{ ('%0x' % states('sensor.alphaess_subnet_mask')|int)[4:6]|int(base=16) }}.{{ ('%0x' % states('sensor.alphaess_subnet_mask')|int)[6:8]|int(base=16) }}"
      availability: "{{ states('sensor.alphaess_subnet_mask') }}"
# Gateway Normalised
    - name: AlphaESS Gateway Normalised
      unique_id: AlphaESS_Gateway_Normalised
      state: "{{ ('%0x' % states('sensor.alphaess_gateway')|int)[:2]|int(base=16) }}.{{ ('%0x' % states('sensor.alphaess_gateway')|int)[2:4]|int(base=16) }}.{{ ('%0x' % states('sensor.alphaess_gateway')|int)[4:6]|int(base=16) }}.{{ ('%0x' % states('sensor.alphaess_gateway')|int)[6:8]|int(base=16) }}"
      availability: "{{ states('sensor.alphaess_gateway') }}"
# BMS Version Normalised
    - name: AlphaESS BMS Version Normalised
      unique_id: AlphaESS_BMS_Version_Normalised
      state: >
        {% if states('sensor.alphaess_bms_version') | length == 3 %}
          V{{ states('sensor.alphaess_bms_version')[:1] }}.{{ states('sensor.alphaess_bms_version')[-2:] }}
        {% else %}
          V{{ states('sensor.alphaess_bms_version')[:2] }}.{{ states('sensor.alphaess_bms_version')[-2:] }}
        {% endif %}
      availability: "{{ states('sensor.alphaess_bms_version') }}"
# EMS Version Normalised
    - name: AlphaESS EMS Version Normalised
      unique_id: AlphaESS_EMS_Version_Normalised
      state: "V{{ states('sensor.alphaess_ems_version_high') }}.{{ states('sensor.alphaess_ems_version_middle') }}.{{ states('sensor.alphaess_ems_version_low') }}{{ (states('sensor.alphaess_ems_version_low_suffix')|urlencode).replace('%00','') }}"
      availability: "{{ not 'unavailable' in [ states('sensor.alphaess_ems_version_high'), states('sensor.alphaess_ems_version_middle'), states('sensor.alphaess_ems_version_low'), states('sensor.alphaess_ems_version_low_suffix') ] }}"
# Excess Power
    - name: AlphaESS Excess Power
      unique_id: AlphaESS_Excess_Power
      unit_of_measurement: W
      state: "{{ (0, states('sensor.alphaess_current_pv_production')|int(0) - states('sensor.alphaess_current_house_load')|float(0)|round(0))|max }}"
# Battery Full
    - name: AlphaESS Battery Full
      unique_id: AlphaESS_Battery_Full
      state: "{{ is_state('sensor.alphaess_battery_status', '1') }}"
      availability: "{{ states('sensor.alphaess_battery_status') }}"
# Battery Cell Voltage Delta
    - name: AlphaESS Battery Cell Voltage Delta
      unique_id: AlphaESS_Battery_Cell_Voltage_Delta
      unit_of_measurement: V
      device_class: voltage
      state_class: measurement
      icon: mdi:battery-alert-variant-outline
      state: "{{ (states('sensor.alphaess_battery_max_cell_voltage')|float(0) - states('sensor.alphaess_battery_min_cell_voltage')|float(0))|round(3) }}"
      availability: "{{ states('sensor.alphaess_battery_max_cell_voltage') not in ['unknown','unavailable'] and states('sensor.alphaess_battery_min_cell_voltage') not in ['unknown','unavailable'] }}"
# Clipping
    - name: AlphaESS Clipping
      unique_id: AlphaESS_Clipping
      state: "{{ (states('sensor.alphaess_pv1_power')|int - states('sensor.alphaess_pv2_power')|int) == 0 and (states('sensor.alphaess_pv1_power')|int + states('sensor.alphaess_pv2_power')|int) > (states('input_select.alphaess_helper_inverter_ac_limit').replace(' kW','')|float * 1000)|int }}"
      availability: "{{ not 'unavailable' in [ states('sensor.alphaess_pv1_power'), states('sensor.alphaess_pv2_power'), states('sensor.alphaess_pv3_power'), states('sensor.alphaess_pv4_power') ] }}"
# House Load > Force Import Power
    - name: AlphaESS House Load > Force Import Power
      unique_id: AlphaESS_House_Load_Force_Import_Power
      state: "{{ states('sensor.alphaess_current_house_load')|int > (states('input_number.alphaess_helper_force_import_power')|float * 1000)|int}}"
      availability: "{{ states('sensor.alphaess_current_house_load') }}"
# System Date
    - name: AlphaESS System Date
      unique_id: AlphaESS_System_Date
      state: "{{ '{:02}'.format((('0000%0x'%states('sensor.alphaess_system_time_ddhh') | int(0))[-4:])[:2]|int(base=16)) }}/{{ '{:02}'.format((('0000%0x'%states('sensor.alphaess_system_time_yymm') | int(0))[-4:])[2:]|int(base=16)) }}/20{{ '{:02}'.format((('0000%0x'%states('sensor.alphaess_system_time_yymm') | int(0))[-4:])[:2]|int(base=16)) }}"
      availability: "{{ not 'unavailable' in [ states('sensor.alphaess_system_time_ddhh'), states('sensor.alphaess_system_time_yymm') ] }}"
# System Time
    - name: AlphaESS System Time
      unique_id: AlphaESS_System_Time
      state: "{{ (('0000%0x'%states('sensor.alphaess_system_time_ddhh') | int(0))[-4:])[2:]|int(base=16) }}:{{ '{:02}'.format((('0000%0x'%states('sensor.alphaess_system_time_mmss') | int(0))[-4:])[:2]|int(base=16)) }}:{{ '{:02}'.format((('0000%0x'%states('sensor.alphaess_system_time_mmss') | int(0))[-4:])[2:]|int(base=16)) }}"
      availability: "{{ not 'unavailable' in [ states('sensor.alphaess_system_time_ddhh'), states('sensor.alphaess_system_time_mmss') ] }}"
# Power Diagram
    - name: "AlphaEss Current House Load ApexCharts"
      unique_id: alphaess_current_house_load_apexcharts
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: "{{ states('sensor.alphaess_current_house_load') | float(0) / 1000 }}"
    - name: "AlphaEss Power Grid ApexCharts"
      unique_id: alphaess_power_grid_apexcharts
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: "{{ states('sensor.alphaess_power_grid') | float(0) / 1000 }}"
    - name: "AlphaEss Power Grid Consumption ApexCharts"
      unique_id: alphaess_power_grid_consumption_apexcharts
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: >
        {% set v = states('sensor.alphaess_power_grid') | float(0) %}
        {{ (v / 1000) if v > 0 else 0 }}
    - name: "AlphaEss Power Grid Feed-In ApexCharts"
      unique_id: alphaess_power_grid_feed_in_apexcharts
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: >
        {% set v = states('sensor.alphaess_power_grid') | float(0) %}
        {{ (-v / 1000) if v < 0 else 0 }}
    - name: "AlphaEss Current PV Production ApexCharts"
      unique_id: alphaess_current_pv_production_apexcharts
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: "{{ states('sensor.alphaess_current_pv_production') | float(0) / 1000 }}"
    - name: "AlphaEss PV1 Power ApexCharts"
      unique_id: alphaess_pv1_power_apexcharts
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: "{{ states('sensor.alphaess_pv1_power') | float(0) / 1000 }}"
    - name: "AlphaEss PV2 Power ApexCharts"
      unique_id: alphaess_pv2_power_apexcharts
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: "{{ states('sensor.alphaess_pv2_power') | float(0) / 1000 }}"
    - name: "AlphaEss PV3 Power ApexCharts"
      unique_id: alphaess_pv3_power_apexcharts
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: "{{ states('sensor.alphaess_pv3_power') | float(0) / 1000 }}"
    - name: "AlphaEss PV4 Power ApexCharts"
      unique_id: alphaess_pv4_power_apexcharts
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: "{{ states('sensor.alphaess_pv4_power') | float(0) / 1000 }}"
    - name: "AlphaEss Power Battery ApexCharts"
      unique_id: alphaess_power_battery_apexcharts
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: "{{ states('sensor.alphaess_power_battery') | float(0) / 1000 }}"
    - name: "AlphaEss Excess Power ApexCharts"
      unique_id: alphaess_excess_power_apexcharts
      unit_of_measurement: "kW"
      device_class: power
      state_class: measurement
      state: "{{ states('sensor.alphaess_excess_power') | float(0) / 1000 }}"

