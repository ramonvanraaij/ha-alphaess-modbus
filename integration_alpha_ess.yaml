            - 0   # Dispatch Active Power, 32000 Offset (2 bytes/registers)
            - "{{ 32000 - ((states('input_number.alphaess_helper_force_import_power')|float * 1000)|int - states('sensor.alphaess_current_house_load')|int) - states('sensor.alphaess_current_pv_production')|int }}"
            - 0   # Dispatch Reactive Power, 10000 Offset (2 bytes/registers)
