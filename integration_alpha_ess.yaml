# Force Discharging Power
      - name: AlphaESS Template Force Discharging Power
        unique_id: AlphaESS_Template_Force_Discharging_Power
        unit_of_measurement: "kW"
        icon: mdi:flash
        state: "{{ states('input_number.alphaess_helper_force_discharging_power') }}"
        set_value:
          - action: input_number.set_value
            data:
              value: "{{ value }}"
            target:
              entity_id: input_number.alphaess_helper_force_discharging_power
        step: 0.1
        min: 0
        max: "{{ (states('input_select.alphaess_helper_inverter_ac_limit').replace(' kW','')|float ) }}"
        availability: "{{ (states('input_select.alphaess_helper_inverter_ac_limit').replace(' kW','')|float ) | is_number }}"
# Force Export Power
