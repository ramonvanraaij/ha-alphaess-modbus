# Synchronise Date & Time
  - id: "AlphaESS_Synchronise_Date_Time"
    alias: "AlphaESS Synchronise Date & Time"
    triggers:
      - trigger: state
        entity_id:
          - input_button.alphaess_helper_synchronise_date_time
    actions:
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x0740
          slave: 85
          value:
            - "{{ (('%02x'|format(now().year|int-2000)) + ('%02x'|format(now().month|int))) | int(base=16) }}"
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x0741
          slave: 85
          value:
            - "{{ (('%02x'|format(now().day|int)) + ('%02x'|format(now().hour|int))) | int(base=16) }}"
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x0742
          slave: 85
          value:
            - "{{ (('%02x'|format(now().minute|int)) + ('%02x'|format(now().second|int))) | int(base=16) }}"
    mode: single

# Filter Clipping
  - id: "AlphaESS_Filter_Clipping"
    alias: AlphaESS Filter Clipping
    triggers:
      - trigger: state
        entity_id:
          - sensor.alphaess_clipping
        for:
          hours: 0
          minutes: 0
          seconds: 10
        id: turn_on
        to:
          - "True"
      - trigger: state
        entity_id:
          - sensor.alphaess_clipping
        for:
          hours: 0
          minutes: 0
          seconds: 10
        id: turn_off
        to:
          - "False"
    conditions: []
    actions:
      - action: input_boolean.{{trigger.id}}
        metadata: {}
        target:
          entity_id: input_boolean.alphaess_helper_clipping
        data: {}
    mode: single

# --- Start Charging Discharging automations
# Set Charging Discharging Control
  - id: "AlphaESS_Charging_Discharging_Control"
    alias: AlphaESS Charging Discharging Control
    triggers:
      - trigger: state
        entity_id:
          - input_select.alphaess_helper_charging_discharging_settings
    actions:
      - action: modbus.write_register
        data:
          hub: modbuspvsystem
          address: 0x084F # Time Period Control
          slave: !secret alphaess_modbus_slaveId
          value:
            - >
              {% if states('input_select.alphaess_helper_charging_discharging_settings') == "Disable" %}
                0
              {% elif states('input_select.alphaess_helper_charging_discharging_settings') == "Enable Grid Charging Battery" %}
                1
              {% elif states('input_select.alphaess_helper_charging_discharging_settings') == "Enable Battery Discharge Time Control" %}
                2
              {% elif states('input_select.alphaess_helper_charging_discharging_settings') == "Enable Grid Charging Battery & Battery Discharge Time Control" %}
                3
              {% endif %}
    mode: single

# Update Charging Discharging Control
  - id: "AlphaESS_Update_Charging_Discharging_Control"
    alias: "AlphaESS Update Charging Discharging Control"
    triggers:
      - trigger: state
        entity_id:
          - sensor.alphaess_charging_time_period_control
    conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.alphaess_charging_time_period_control
          state: 'unavailable'
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: sensor.alphaess_charging_time_period_control
                state: "0"
            sequence:
              - action: input_select.select_option
                metadata: {}
                data:
                  option: Disable
                target:
                  entity_id: input_select.alphaess_helper_charging_discharging_settings
          - conditions:
              - condition: state
                entity_id: sensor.alphaess_charging_time_period_control
                state: "1"
            sequence:
              - action: input_select.select_option
                metadata: {}
                data:
                  option: Enable Grid Charging Battery
                target:
                  entity_id: input_select.alphaess_helper_charging_discharging_settings
          - conditions:
              - condition: state
                entity_id: sensor.alphaess_charging_time_period_control
                state: "2"
            sequence:
              - action: input_select.select_option
                metadata: {}
                data:
                  option: Enable Battery Discharge Time Control
                target:
                  entity_id: input_select.alphaess_helper_charging_discharging_settings
          - conditions:
              - condition: state
                entity_id: sensor.alphaess_charging_time_period_control
                state: "3"
            sequence:
              - action: input_select.select_option
                metadata: {}
                data:
                  option: Enable Grid Charging Battery & Battery Discharge Time Control
                target:
                  entity_id: input_select.alphaess_helper_charging_discharging_settings
    mode: single

